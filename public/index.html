<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFT Tracker Generator</title>
  <style>
    body {
      background: #0f1318;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; color: #00e676; margin: 0; }
    button {
      background: #00e676;
      color: #0c1015;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #00c853; }
    textarea {
      width: 100%;
      height: 600px;
      background: #181c24;
      color: #00e676;
      border: 1px solid #2d323f;
      border-radius: 8px;
      padding: 15px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      box-sizing: border-box;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>HFT Bulk Deal → Pine Script Sync</h1>
      <button id="copyBtn" onclick="copyCode()">Copy Code</button>
    </div>
    <textarea id="outputArea" readonly placeholder="Fetching latest Azure Blob data..."></textarea>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/generate');
        const text = await res.text();
        document.getElementById('outputArea').value = text;
      } catch (err) {
        document.getElementById('outputArea').value = 'Failed to load data: ' + err;
      }
    }

    function copyCode() {
      const copyText = document.getElementById("outputArea");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      const btn = document.getElementById("copyBtn");
      btn.innerText = "Copied!";
      btn.style.background = "#2979ff";
      btn.style.color = "#ffffff";
      setTimeout(() => {
        btn.innerText = "Copy Code";
        btn.style.background = "#00e676";
        btn.style.color = "#0c1015";
      }, 2000);
    }

    loadData();
  </script>
</body>
</html>
