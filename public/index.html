<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HFT Bulk Deal → Pine Script Generator</title>
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 960px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-area h1 {
      font-size: 20px;
      color: #58a6ff;
      margin: 0 0 4px 0;
      font-weight: 700;
    }
    .title-area p {
      margin: 0;
      font-size: 13px;
      color: #8b949e;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #161b22;
      border: 1px solid #30363d;
      color: #7ee787;
    }
    .badge.loading {
      color: #e3b341;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #c9d1d9;
      display: block;
      margin-bottom: 8px;
    }

    /* Select2 Dark Theme Styling */
    .select2-container--default .select2-selection--multiple {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      min-height: 42px;
      padding: 4px 8px;
      color: #c9d1d9;
    }
    .select2-container--default.select2-container--focus .select2-selection--multiple {
      border-color: #58a6ff;
    }

    /* Fixed Tag Pill Styling - No overlap */
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
      display: inline-flex !important;
      align-items: center !important;
      flex-direction: row !important;
      background-color: #1f6feb !important;
      border: 1px solid #388bfd !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      padding: 3px 4px 3px 8px !important;
      font-size: 12.5px !important;
      font-weight: 500 !important;
      margin: 4px 6px 4px 0 !important;
      line-height: 1.4 !important;
      position: relative !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__display {
      padding-left: 0 !important;
      padding-right: 6px !important;
      color: #ffffff !important;
      order: 1 !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
      position: static !important;
      float: none !important;
      background: transparent !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.75) !important;
      padding: 0 4px !important;
      margin: 0 !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      border-radius: 4px !important;
      transition: all 0.15s ease !important;
      order: 2 !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
      background-color: rgba(248, 81, 73, 0.3) !important;
      color: #ff7b72 !important;
    }

    .select2-container--default .select2-search--inline .select2-search__field {
      color: #c9d1d9;
      font-family: inherit;
      margin-top: 6px;
      font-size: 13px;
    }

    /* Elevated Floating Dropdown */
    .select2-dropdown {
      background-color: #1c2128 !important;
      border: 1px solid #444c56 !important;
      border-radius: 8px !important;
      color: #c9d1d9 !important;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6) !important;
      z-index: 99999 !important;
      overflow: hidden !important;
    }

    .select2-container--default .select2-results__option {
      padding: 9px 14px !important;
      font-size: 13px !important;
      color: #adbac7 !important;
      transition: background 0.1s ease;
    }

    .select2-container--default .select2-results__option--highlighted[aria-selected] {
      background-color: #1f6feb !important;
      color: #ffffff !important;
    }

    .select2-container--default .select2-results__option[aria-selected=true] {
      background-color: #2d333b !important;
      color: #768390 !important;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
    }
    .btn-primary:hover:not(:disabled) {
      background: #2ea043;
    }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border-color: #30363d;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #30363d;
      color: #ffffff;
    }

    .btn-copy {
      background: #1f6feb;
      color: #ffffff;
      border-color: #388bfd;
      margin-left: auto;
    }
    .btn-copy:hover:not(:disabled) {
      background: #388bfd;
    }
    .btn-copy.copied {
      background: #238636;
      border-color: #2ea043;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      font-size: 12px;
      color: #8b949e;
    }
    .output-meta {
      display: flex;
      gap: 16px;
    }
    textarea {
      width: 100%;
      height: 520px;
      background: #0d1117;
      color: #7ee787;
      border: none;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      box-sizing: border-box;
      resize: vertical;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-area">
        <h1>HFT Bulk Deal &rarr; Pine Script Generator</h1>
        <p>Generates compact, high-speed TradingView indicator scripts for 12 tracked HFT & Algo Desks</p>
      </div>
      <div id="statusBadge" class="badge loading">
        Loading stocks...
      </div>
    </div>

    <div class="card">
      <label for="stockSelect">Choose Stocks (Search or Multi-Select):</label>
      <select id="stockSelect" multiple style="width: 100%;">
        <!-- Populated dynamically from API -->
      </select>

      <div class="btn-row">
        <button id="btnGenerate" class="btn-primary" onclick="generateScript()">
          ⚡ Generate Pine Script
        </button>
        <button class="btn-secondary" onclick="selectAll()">Select All</button>
        <button class="btn-secondary" onclick="clearAll()">Clear</button>
        <button id="btnCopy" class="btn-copy" onclick="copyCode()">
          📋 Copy Code
        </button>
      </div>
    </div>

    <div class="output-card">
      <div class="output-header">
        <div class="output-meta">
          <span id="scriptStats">Pine Script v5 Indicator</span>
        </div>
        <div id="copyNotice" style="color: #7ee787; display: none;">✓ Copied to clipboard!</div>
      </div>
      <textarea id="output" readonly placeholder="Select stocks above and click 'Generate Pine Script' to view TradingView Pine Script code..."></textarea>
    </div>
  </div>

  <!-- jQuery & Select2 Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script>
    let allSymbols = [];

    $(document).ready(function() {
      const $select = $('#stockSelect');

      $select.select2({
        placeholder: "Search and select stocks (e.g. 5PAISA, ANGELONE)...",
        allowClear: true,
        closeOnSelect: true
      });

      // Ensure typed search keyword is completely cleared when a stock is selected or removed
      $select.on('select2:select select2:unselect', function() {
        setTimeout(function() {
          $('.select2-search__field').val('').trigger('input');
        }, 10);
      });

      initSymbols();
    });

    async function initSymbols() {
      const badge = document.getElementById("statusBadge");
      try {
        badge.className = "badge loading";
        badge.innerText = "Fetching stocks from Azure Blob...";
        
        const res = await fetch("/api/generate?action=symbols");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        
        allSymbols = data.symbols || [];
        const select = $('#stockSelect');
        select.empty();

        allSymbols.forEach(sym => {
          select.append(new Option(sym, sym, false, false));
        });

        badge.className = "badge";
        badge.innerText = `✓ ${allSymbols.length} stocks available (12 Desks)`;

        // Pre-select first 3 stocks if available to provide an instant demo script
        if (allSymbols.length > 0) {
          const defaults = allSymbols.slice(0, 3);
          select.val(defaults).trigger('change');
          generateScript();
        }
      } catch (err) {
        console.error("Failed to load symbols:", err);
        badge.className = "badge loading";
        badge.innerText = "Error loading symbols";
        document.getElementById("output").value = "// Error loading stock list from server: " + err.message + "\n// Please try refreshing the page.";
      }
    }

    function selectAll() {
      $('#stockSelect').val(allSymbols).trigger('change');
    }

    function clearAll() {
      $('#stockSelect').val([]).trigger('change');
      document.getElementById("output").value = "";
      document.getElementById("scriptStats").innerText = "Pine Script v5 Indicator";
    }

    async function generateScript() {
      const selected = $('#stockSelect').val() || [];
      const area = document.getElementById("output");
      const genBtn = document.getElementById("btnGenerate");
      const stats = document.getElementById("scriptStats");

      if (selected.length === 0) {
        alert("Please select at least one stock to generate script!");
        return;
      }

      genBtn.disabled = true;
      genBtn.innerText = "⏳ Generating...";
      area.value = "Fetching and compiling Pine Script for " + selected.length + " stock(s)...";

      try {
        const query = selected.length === allSymbols.length 
          ? "/api/generate?symbols=ALL" 
          : "/api/generate?symbols=" + encodeURIComponent(selected.join(","));

        const res = await fetch(query);
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || ("HTTP " + res.status));
        }

        const script = await res.text();
        area.value = script;
        stats.innerText = `Pine Script v5 | ${selected.length} Stock(s) | ${script.length.toLocaleString()} characters`;
      } catch (err) {
        area.value = "// Error generating Pine Script: " + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.innerText = "⚡ Generate Pine Script";
      }
    }

    function copyCode() {
      const area = document.getElementById("output");
      if (!area.value) return;
      area.select();
      navigator.clipboard.writeText(area.value);

      const btn = document.getElementById("btnCopy");
      const notice = document.getElementById("copyNotice");

      btn.classList.add("copied");
      btn.innerText = "✓ Copied!";
      notice.style.display = "block";

      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerText = "📋 Copy Code";
        notice.style.display = "none";
      }, 2000);
    }
  </script>
</body>
</html>
