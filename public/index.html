<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HFT Tracker Sync</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
    h1 { font-size: 18px; color: #58a6ff; margin: 0; }
    .controls { display: flex; gap: 8px; }
    input { background: #161b22; border: 1px solid #30363d; color: white; padding: 8px 12px; border-radius: 6px; text-transform: uppercase; }
    button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2ea043; }
    textarea { width: 100%; height: 550px; background: #161b22; color: #7ee787; border: 1px solid #30363d; border-radius: 6px; padding: 14px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>HFT Bulk Deal &rarr; Pine Script</h1>
      <div class="controls">
        <input type="text" id="symInput" placeholder="Symbol (e.g. ANTELOPUS)" />
        <button onclick="fetchData()">Filter Stock</button>
        <button onclick="fetchAll()">Show All</button>
        <button id="copyBtn" onclick="copyCode()">Copy Code</button>
      </div>
    </div>
    <textarea id="output" readonly placeholder="Click Filter Stock or Show All..."></textarea>
  </div>

  <script>
    async function loadData(url) {
      const area = document.getElementById("output");
      area.value = "Fetching data...";
      try {
        const res = await fetch(url);
        area.value = await res.text();
      } catch (err) {
        area.value = "Error: " + err;
      }
    }

    function fetchData() {
      const sym = document.getElementById("symInput").value.trim().toUpperCase();
      loadData(sym ? `/api/generate?symbol=${encodeURIComponent(sym)}` : "/api/generate");
    }

    function fetchAll() {
      document.getElementById("symInput").value = "";
      loadData("/api/generate");
    }

    function copyCode() {
      const area = document.getElementById("output");
      area.select();
      navigator.clipboard.writeText(area.value);
      const btn = document.getElementById("copyBtn");
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy Code", 1500);
    }

    fetchAll();
  </script>
</body>
</html>
