name: Daily NSE Bulk Deal Sync

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST (Monday through Friday)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  sync:
    name: Sync Bulk Deals to Azure Blob
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Ingestion Pipeline
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python scripts/sync_nse_bulk_deals.py
